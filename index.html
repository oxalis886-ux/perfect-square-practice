<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>平方數熟記練習</title>
<style>
:root{font-family:'Microsoft JhengHei',system-ui,sans-serif;color:#203c45;background:#edf4f3;font-size:18px}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:24px 18px}h1{font-size:30px;margin:6px 0 12px}h2{font-size:22px;margin:0 0 16px}p{line-height:1.65}.eyebrow{font-size:14px;letter-spacing:2px;color:#42786f;font-weight:700}.card{background:white;border:1px solid #dbe7e4;border-radius:20px;padding:24px;margin:18px 0;box-shadow:0 12px 32px #173d3508}.muted{font-size:15px;color:#5c7276}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fields label:last-child{grid-column:1/-1}label{display:block;font-size:16px}input,select,button{font:inherit;border-radius:10px}input,select{width:100%;border:1px solid #a9c0ba;background:white;padding:12px;margin-top:6px;color:inherit}button{border:0;background:#176b5b;color:white;padding:13px 20px;cursor:pointer;font-weight:700}button:disabled{opacity:.45;cursor:default}button.secondary{background:#e6efec;color:#284f48}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #e4a640;outline-offset:3px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}[hidden]{display:none!important}.quizhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.time{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums}.urgent{color:#b44832}.bar{height:8px;background:#e5eeeb;border-radius:10px;margin-top:12px;overflow:hidden}#timerBar{height:100%;width:100%;background:#318975}.question{font-size:60px;text-align:center;font-weight:750;margin:18px 0 12px}.answerbox{font-size:34px;text-align:center;min-height:62px;padding:8px;background:#f1f6f4;border:2px solid #cbded6;border-radius:12px;font-variant-numeric:tabular-nums}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:360px;margin:14px auto}.keypad button{background:#edf3f1;color:#203c45;font-size:24px;padding:10px;touch-action:manipulation}.keypad button.small{font-size:16px}.submit{display:block;width:100%;max-width:360px;margin:auto}#feedback{font-size:22px;font-weight:700;text-align:center;line-height:1.5;margin:16px 0}#next{width:100%}#error{color:#b44832}.reportheader{display:flex;justify-content:space-between;align-items:center;gap:8px}.badge{background:#e6f2ed;color:#176b5b;padding:6px 10px;border-radius:30px;font-size:14px;white-space:nowrap}.identity{font-size:18px;line-height:1.7;overflow-wrap:anywhere}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.metric{background:#f0f6f3;border-radius:12px;text-align:center;padding:14px 6px}.metric strong{font-size:28px;display:block}.metric span{font-size:14px;color:#59716d}.summaryline{font-size:16px;line-height:1.7;margin:8px 0}.wrong{background:#fff7ed;border-radius:12px;padding:12px;font-size:16px;line-height:1.8;overflow-wrap:anywhere}details{margin-top:18px}summary{cursor:pointer;font-size:16px}table{width:100%;border-collapse:collapse;font-size:15px;margin-top:12px}td,th{padding:8px 4px;border-bottom:1px solid #e2ebe7;text-align:left}.reportfooter{font-size:13px;color:#657c77;margin-top:14px}.success{color:#176b5b}.bad{color:#a64532}@media(max-width:500px){main{padding:16px 12px}.card{padding:18px;margin:14px 0}h1{font-size:27px}.question{font-size:50px;margin:12px 0}.metric strong{font-size:25px}.identity{font-size:16px}.keypad button{padding:9px}.time{font-size:22px}}@media print{#setup,#quiz,.actions,header,details,#notice{display:none!important}main{padding:0;max-width:none}.card{box-shadow:none}}
</style></head>
<body><main><header><div class="eyebrow">熟記 · 練習 · 進步</div><h1>平方數熟記練習</h1></header>
<section id="setup" class="card"><h2>準備開始</h2><div class="fields"><label>班級<input id="className" maxlength="20" placeholder="例如：701" autocomplete="off"></label><label>座號<input id="seat" maxlength="10" placeholder="例如：08" inputmode="numeric" autocomplete="off"></label><label>姓名<input id="student" maxlength="30" autocomplete="off"></label></div><label style="margin-top:18px">練習範圍<select id="range"><option value="1-10">1～10 的平方（10 題）</option><option value="11-20">11～20 的平方（10 題）</option><option value="1-20">1～20 的平方（20 題）</option></select></label><p class="muted">① 題目隨機排列，每回不重複。<br>② 每題限時 10 秒，送出後立即顯示答案。<br>③ 看完答案，按「下一題」才開始下一題計時。<br>④ 完成後截圖交作業，再練一回不用重填資料。</p><p id="error" role="alert"></p><div class="actions"><button id="start">開始練習</button><button id="changeStudent" class="secondary">換人練習</button></div></section>
<section id="quiz" class="card" hidden><div class="quizhead"><span id="progressText"></span><span class="time" id="timer" aria-label="剩餘秒數"></span></div><div class="bar" aria-hidden="true"><div id="timerBar"></div></div><div class="question" id="question"></div><div class="answerbox" id="answer" role="textbox" aria-label="你的答案" aria-readonly="true">？</div><div id="keypad" class="keypad" aria-label="數字鍵盤"><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="clear" class="small">清除</button><button data-key="0">0</button><button data-key="back" class="small" aria-label="刪除最後一位">⌫</button></div><button id="submit" class="submit">送出答案</button><p class="muted" id="keyboardHint" style="text-align:center">可點數字按鈕，或用鍵盤輸入後按 Enter。</p><div id="feedback" role="status" aria-live="polite"></div><button id="next" hidden>下一題</button></section>
<section id="result" class="card" hidden><div id="report"><div class="reportheader"><h2 style="margin:0">平方數練習成果</h2><span class="badge">每題限時 10 秒</span></div><p id="identity" class="identity"></p><div class="summaryline" id="reportDate"></div><div class="summaryline" id="reportRange"></div><div class="metrics"><div class="metric"><strong id="correctMetric"></strong><span>答對／總題數</span></div><div class="metric"><strong id="accuracyMetric"></strong><span>正確率</span></div><div class="metric"><strong id="secondsMetric"></strong><span>總作答秒數</span></div></div><p class="summaryline" id="counts"></p><p class="summaryline" id="average"></p><div class="wrong" id="wrongSummary"></div><div class="reportfooter">計時包含回想與輸入；不含填資料、看答案及等待下一題。</div></div><details><summary>查看每題答案與作答秒數</summary><table><thead><tr><th>題目</th><th>作答</th><th>正解</th><th>秒數</th><th>結果</th></tr></thead><tbody id="detailsBody"></tbody></table></details><p id="notice" class="muted">請先截圖上方成果，再按「再練一回」。如要交逐題紀錄，可展開上方明細另行截圖。</p><div class="actions"><button id="again">再練一回</button><button id="changeRange" class="secondary">更換範圍</button><button id="newStudent" class="secondary">換人練習</button></div></section>
</main><script>
'use strict';
const $=id=>document.getElementById(id);
const state={questions:[],records:[],index:0,answer:'',active:false,started:0,deadline:0,ticker:null,range:'',identity:null};
function shuffled(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function clearTimer(){if(state.ticker!==null)clearInterval(state.ticker);state.ticker=null}
function start(){if(!['className','seat','student'].every(id=>$(id).value.trim())){$('error').textContent='請填寫班級、座號和姓名。';return}$('error').textContent='';state.identity={className:$('className').value.trim(),seat:$('seat').value.trim(),student:$('student').value.trim()};state.range=$('range').value;const [lo,hi]=state.range.split('-').map(Number);state.questions=shuffled(Array.from({length:hi-lo+1},(_,i)=>lo+i));state.records=[];state.index=0;$('setup').hidden=true;$('result').hidden=true;$('quiz').hidden=false;showQuestion()}
function showQuestion(){clearTimer();state.active=false;state.answer='';$('answer').textContent='？';$('progressText').textContent=`第 ${state.index+1} 題／共 ${state.questions.length} 題`;$('question').textContent=state.questions[state.index]+'² = ?';$('feedback').textContent='';$('feedback').className='';$('next').hidden=true;$('submit').hidden=false;$('submit').disabled=false;$('keypad').hidden=false;$('keyboardHint').hidden=false;document.querySelectorAll('[data-key]').forEach(b=>b.disabled=false);$('timer').classList.remove('urgent');$('timer').textContent='剩餘 10.0 秒';$('timerBar').style.width='100%';
// 在畫面更新後啟動，避免前一題 Enter 的按鍵動作影響下一題。
requestAnimationFrame(()=>{state.started=performance.now();state.deadline=state.started+10000;state.active=true;state.ticker=setInterval(tick,40)})}
function tick(){if(!state.active)return;const remaining=Math.max(0,state.deadline-performance.now());$('timer').textContent='剩餘 '+(remaining/1000).toFixed(1)+' 秒';$('timerBar').style.width=(remaining/100)+'%';$('timer').classList.toggle('urgent',remaining<=3000);if(remaining<=0)settle(true)}
function key(k){if(!state.active)return;if(performance.now()>=state.deadline){settle(true);return}if(/^\d$/.test(k)&&state.answer.length<3)state.answer+=k;else if(k==='back')state.answer=state.answer.slice(0,-1);else if(k==='clear')state.answer='';$('answer').textContent=state.answer||'？'}
function settle(timeout){if(!state.active)return;const now=performance.now();timeout=timeout||now>=state.deadline;if(!timeout&&!state.answer)return;state.active=false;clearTimer();const n=state.questions[state.index],answer=state.answer===''?null:Number(state.answer),seconds=timeout?10:Math.min(10,(now-state.started)/1000);const correct=!timeout&&answer===n*n;state.records.push({n,answer,seconds,timeout,correct});$('timer').textContent=timeout?'時間到':`作答 ${seconds.toFixed(1)} 秒`;$('timerBar').style.width='0%';$('keypad').hidden=true;$('keyboardHint').hidden=true;$('submit').hidden=true;$('feedback').className=correct?'success':'bad';$('feedback').textContent=(timeout?'時間到！':correct?'答對了！':'答錯了！')+` ${n}²＝${n*n}`;$('next').textContent=state.index===state.questions.length-1?'查看成果':'下一題';$('next').hidden=false;$('next').focus()}
function next(){if(state.active)return;state.index++;if(state.index<state.questions.length)showQuestion();else finish()}
function finish(){clearTimer();state.active=false;$('quiz').hidden=true;$('result').hidden=false;const r=state.records,total=r.reduce((s,v)=>s+v.seconds,0),correct=r.filter(v=>v.correct).length,timeout=r.filter(v=>v.timeout).length,wrong=r.length-correct-timeout;const id=state.identity;$('identity').textContent=`班級：${id.className}　座號：${id.seat}　姓名：${id.student}`;$('reportDate').textContent='完成時間：'+new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());$('reportRange').textContent='練習範圍：'+state.range.replace('-','～')+' 的平方（隨機順序）';$('correctMetric').textContent=correct+'／'+r.length;$('accuracyMetric').textContent=Math.round(correct/r.length*100)+'%';$('secondsMetric').textContent=total.toFixed(1);$('counts').textContent=`答錯：${wrong} 題　逾時：${timeout} 題`;$('average').textContent=`平均每題：${(total/r.length).toFixed(1)} 秒（逾時題以 10 秒計）`;$('wrongSummary').textContent=r.every(v=>v.correct)?'全部答對，繼續保持！':'需要再記熟：'+r.filter(v=>!v.correct).map(v=>`${v.n}²＝${v.n*v.n}${v.timeout?'（逾時）':''}`).join('、');$('detailsBody').replaceChildren();r.forEach(v=>{const tr=document.createElement('tr');[v.n+'²',v.answer===null?'未作答':String(v.answer),String(v.n*v.n),v.seconds.toFixed(1),v.timeout?'逾時':v.correct?'答對':'答錯'].forEach(text=>{const td=document.createElement('td');td.textContent=text;tr.append(td)});$('detailsBody').append(tr)});$('result').querySelector('details').open=false;window.scrollTo({top:0,behavior:'instant'})}
function setup(clear){clearTimer();state.active=false;$('quiz').hidden=true;$('result').hidden=true;$('setup').hidden=false;if(clear){['className','seat','student'].forEach(id=>$(id).value='');$('className').focus()}$('error').textContent=''}
$('start').onclick=start;$('submit').onclick=()=>settle(false);$('next').onclick=next;$('again').onclick=start;$('changeRange').onclick=()=>setup(false);$('changeStudent').onclick=()=>setup(true);$('newStudent').onclick=()=>setup(true);document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>key(b.dataset.key));document.addEventListener('keydown',e=>{if($('quiz').hidden)return;if(e.repeat){if(e.key==='Enter')e.preventDefault();return}if(/^\d$/.test(e.key)){e.preventDefault();key(e.key)}else if(e.key==='Backspace'){e.preventDefault();key('back')}else if(e.key==='Delete'){e.preventDefault();key('clear')}else if(e.key==='Enter'){e.preventDefault();if(state.active)settle(false);else if(!$('next').hidden)next()}});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.active)tick()});
</script></body></html>
